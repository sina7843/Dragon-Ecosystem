# Throwaway database for automated tests only.
#
# The default Compose file never publishes a MongoDB host port. Integration tests
# run on the host, so this separate project exposes a *different* port (27018),
# approved as an override under IMPLEMENTATION_DECISIONS.md section 8 on
# 2026-07-21 with the condition that it binds to loopback only. It is never part
# of the default stack and its data is disposable.
name: dragon-ecosystem-test

services:
  mongo-test:
    image: mongo:8.0
    # Replica set required for transactions, same as the default stack.
    command: ["--replSet", "rs-test", "--bind_ip_all"]
    ports:
      # Loopback only: reachable from this machine, never from the network.
      - "127.0.0.1:27018:27017"
    # Test data never needs to survive: keeping it in memory makes runs fast and clean.
    tmpfs:
      - /data/db
    healthcheck:
      # The member host must be reachable from inside the container, so it is the
      # container-local address. Tests connect from the host with directConnection,
      # which ignores the member list and still gets a transaction-capable primary.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs-test',members:[{_id:0,host:'127.0.0.1:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
