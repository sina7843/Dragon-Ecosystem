services:
  api:
    environment:
      NODE_ENV: development
      # Dedicated development database: its name carries the dev/demo/local marker the
      # demo seeder requires, so the production "dragon" database can never be seeded.
      MONGODB_URI: mongodb://mongo:27017/dragon_dev?replicaSet=rs0
      AUTH_SECRET: local-development-auth-secret-1234567890-abcdef
      PAYMENTS_CALLBACK_SECRET: local-development-payment-secret-1234567890-abcdef
      ANALYTICS_PSEUDONYM_SALT: local-development-analytics-salt-1234567890-abcdef
      PUBLIC_ORIGIN: ""
      ENABLE_DEV_ROUTES: "false"
      # Deterministic mock payment provider (never a live provider) so demo purchases work.
      PAYMENTS_MOCK_ENABLED: "true"
      # Paid tournament entry (OD-007). Development only, and only meaningful alongside the
      # mock provider above — production stays off unless it is set there deliberately
      # (.env.example ships it as false). Without it, checkout, the Dragon-Coin hold, and
      # the pending-payment registration state have no data to review.
      PAID_TOURNAMENTS_ENABLED: "true"
      # OD-015 paid course enrolment (DRAGON-20). Development only, and only meaningful
      # alongside the mock provider above — production stays off unless it is set there
      # deliberately (.env.example ships it false). Without it a course cannot be priced,
      # so the reservation, capture, and entitlement path have no data to review.
      PAID_COURSES_ENABLED: "true"
      # Match the web client's 20 MB image cap so a large PNG isn't rejected by an opaque
      # body-limit 413 before the service can validate it. The service still enforces this cap.
      MEDIA_MAX_BYTES: "20000000"
      # Demo and local review sign in as the same handful of accounts repeatedly, which
      # exhausts the production-shaped per-mobile OTP budget within minutes. Raised here
      # only — production keeps the default — matching what the browser suite already does
      # in playwright.config.ts. The limiter itself is unchanged and still enforced.
      OTP_REQUESTS_PER_MOBILE: "50"
      OTP_RESEND_SECONDS: "5"