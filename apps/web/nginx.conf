server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Baseline response headers (SEC-008). Full CSP and CORS policy is owned by DRAGON-16b.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Container health probe only; not a public status page.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Same-origin API path so the browser bundle never carries an API origin.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SEO + media served by the API at the site root (SEO-005/006, MEDIA-007). These are
    # canonical crawler/asset locations, so they must not be swallowed by the SPA fallback.
    location = /robots.txt { proxy_pass http://api:3000; proxy_set_header Host $host; }
    location = /sitemap.xml { proxy_pass http://api:3000; proxy_set_header Host $host; }
    location /media/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # History-mode routing: every unknown path is resolved by the SPA router. A path that
    # exists as a static file (asset) is served directly; otherwise the SPA renders,
    # returning its localized 404 view for unknown routes (SEO-010 status is refined below).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
