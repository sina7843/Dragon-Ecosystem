server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the nginx version (fingerprinting aid).
    server_tokens off;

    # Response security headers (SEC-008). The SPA is fully self-hosted (no external
    # scripts/styles/fonts/images; the API is same-origin), so a strict CSP holds.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # CSP: only same-origin code/styles; images allow data: URIs (inlined assets) and self;
    # connect to the same origin only (the API is same-origin). No inline/eval scripts.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    # HSTS: enforce HTTPS at the browser. The TLS terminator sits in front of this container
    # in production; the header is harmless over the internal HTTP hop and required for SEC-001.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Container health probe only; not a public status page.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Same-origin API path so the browser bundle never carries an API origin.
    location /api/ {
        # Media uploads are base64 in a JSON body (~1.4x the raw bytes), so nginx's 1 MB
        # default would reject a valid upload with an opaque 413 before the API sees it.
        # Sized for MEDIA_MAX_BYTES=20000000 (compose); the API still enforces the real
        # cap per route, so this is only the outer envelope.
        client_max_body_size 30m;
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SEO + media served by the API at the site root (SEO-005/006, MEDIA-007). These are
    # canonical crawler/asset locations, so they must not be swallowed by the SPA fallback.
    location = /robots.txt { proxy_pass http://api:3000; proxy_set_header Host $host; }
    location = /sitemap.xml { proxy_pass http://api:3000; proxy_set_header Host $host; }
    location /media/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Cache policy for static content (PERF-009).
    #
    # The invalidation mechanism is the filename, not a purge: Vite emits every bundled
    # asset as `name-<contenthash>.js|css`, so changed bytes get a new URL and the old one
    # is never asked for again. That is what makes `immutable` safe here and what a CDN in
    # front of this container would inherit — no invalidation API is needed for /assets/.
    #
    # `index.html` is the one file that must never be cached: it carries the references to
    # the hashed assets, so a cached copy would keep pointing a browser at the previous
    # deployment's bundles. It is revalidated on every navigation.
    location /assets/ {
        # Content-addressed by build hash: safe to keep for a year and never revalidate.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # `add_header` in a location REPLACES the server-level set rather than adding to it,
        # so every server-level security header is restated here. All six, not the subset
        # that looks relevant to a script or stylesheet: `try_files ... =404` can return an
        # HTML error body from this location, and a partial list is the kind of difference
        # nobody notices until it matters. `nginx-cache.test.ts` derives the required set
        # from the server block, so adding a header there fails until it is mirrored here.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        try_files $uri =404;
    }

    # History-mode routing: every unknown path is resolved by the SPA router. A path that
    # exists as a static file (asset) is served directly; otherwise the SPA renders,
    # returning its localized 404 view for unknown routes (SEO-010 status is refined below).
    #
    # Files under `public/` (the partner logos) are *not* content-hashed, so they get
    # revalidation rather than immutability: nginx's ETag and Last-Modified make a repeat
    # visit a conditional request that answers 304 without resending the bytes, and a
    # replaced file is picked up on the next request instead of after a year.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        try_files $uri $uri/ /index.html;
    }
}
