name: dragon-ecosystem

services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    # Single-node replica set: MongoDB only offers multi-document transactions on a
    # replica set, and section 32.1 requires atomic transactions.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    environment:
      MONGO_INITDB_DATABASE: dragon
    # Named volume keeps data across stop/start (DEC-038, TEST-025).
    volumes:
      - mongo-data:/data/db
    # Deliberately no host port: MongoDB is reachable only as mongo:27017 on the
    # internal network (IMPLEMENTATION_DECISIONS.md section 8).
    healthcheck:
      # Initiates the replica set on first boot, then reports status on every later check.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    networks:
      - dragon

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      MONGODB_URI: mongodb://mongo:27017/dragon?replicaSet=rs0
      # Required secret. Provide a real value via the deployment secret store; the
      # placeholder here lets the local stack start and MUST NOT be used in production.
      AUTH_SECRET: ${AUTH_SECRET:-local-compose-development-secret-change-me}
      # Trust X-Forwarded-For only from nginx's fixed address below. A direct
      # caller therefore cannot spoof the client IP used for per-IP rate limits.
      TRUSTED_PROXIES: 172.28.0.10
      # Kavenegar SMS credentials come from the deployment environment / .env. This service
      # runs NODE_ENV=production, so a configured key selects the real provider; SMS_PROVIDER
      # can force either provider. Secrets are never committed - only referenced here.
      SMS_PROVIDER: ${SMS_PROVIDER:-}
      KAVENEGAR_API_KEY: ${KAVENEGAR_API_KEY:-}
      KAVENEGAR_SENDER: ${KAVENEGAR_SENDER:-}
      KAVENEGAR_OTP_TEMPLATE: ${KAVENEGAR_OTP_TEMPLATE:-}
    depends_on:
      mongo:
        condition: service_healthy
    # No host port: the API is reachable only as api:3000 on the internal network,
    # so browsers must go through nginx. `expose` documents the internal port.
    expose:
      - "3000"
    # Allows the SIGTERM handler to close connections before the container exits.
    stop_grace_period: 20s
    networks:
      - dragon

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    # nginx is the only public entry point and reaches the API over the internal
    # network from a fixed address the API trusts as its reverse proxy.
    ports:
      - "8080:8080"
    networks:
      dragon:
        ipv4_address: 172.28.0.10

volumes:
  mongo-data:
    name: dragon-mongo-data

networks:
  dragon:
    driver: bridge
    ipam:
      config:
        # Fixed subnet so nginx can hold a stable address the API trusts. Other
        # services get dynamic addresses in this range and are not trusted proxies.
        - subnet: 172.28.0.0/16
